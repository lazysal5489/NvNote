name: nvnote
description: "NvNote a markdown app run on you local disk."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.7

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^2.0.0
  flutter_markdown_plus: ^1.0.12
  url_launcher: ^6.3.3
  flutter_highlight: ^0.7.0
  markdown: ^7.3.1
  material_symbols_icons: ^4.2960.0
  drift: ^2.35.4
  drift_flutter: ^0.3.1
  path: ^1.9.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  drift_dev: ^2.35.3
  build_runner: ^2.17.1

flutter:

  uses-material-design: true

fonts:
    - family: JetBrainMono
      fonts:
        - asset: fonts/JetBrainMono-Regular.ttf
        - asset: fonts/JetBrainMono-italic.ttf
          style: italic
        - asset: fonts/JetBrainMono-Bold.ttf
          weight: 700
